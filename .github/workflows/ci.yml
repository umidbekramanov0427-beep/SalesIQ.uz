# Full check of the code: unit tests, TypeScript, production build and a
# smoke test of the built app is too heavy for every push -- the
# repository is private and the Uptime workflow already uses most of the
# 2000 free Actions minutes a month. So this runs on pull requests and by
# hand (Actions → CI → Run workflow); the server builds every push to main
# anyway and the Uptime run smoke-tests production every 30 minutes. Locally the
# same check is `npm run check`.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json resolves from the public npm registry (bun.lock
      # points at Lovable's private one); fall back to a plain install if
      # the lock is behind package.json.
      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
